<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test PETA Remember Me</title>
  <link rel="stylesheet" href="http://localhost:5173/dist/welcome-back.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
    rel="stylesheet">
</head>

<body>
  <script type="module" src="http://localhost:5173/dist/welcome-back.js"></script>
  <div class="welcome-back" style="max-width: 400px;">
    <div>
      <h1>Welcome back, Nick!</h1>
      <p>1234 Main Street<br>Apt 101<br>Springfield, IL 62704</p>
    </div>
    <span class="edit">Edit</span>
  </div>
  <div class="en__field__item">
    <input id="remember-me-checkbox" type="checkbox" class="en__field__input en__field__input--checkbox">
    <label for="remember-me-checkbox" class="en__field__label en__field__label--item" style="white-space: nowrap;">
      <div class="rememberme-content" style="display: inline-flex; align-items: center;">
        Remember Me
        <a id="rememberme-learn-more-toggle">
          <svg style="height: 14px; width: auto; z-index: 1;" width="20" height="20" viewBox="0 0 20 20" fill="none"
            xmlns="http://www.w3.org/2000/svg">
            <path
              d="M11 7H9V5H11V7ZM11 9H9V15H11V9ZM10 2C5.59 2 2 5.59 2 10C2 14.41 5.59 18 10 18C14.41 18 18 14.41 18 10C18 5.59 14.41 2 10 2ZM10 0C15.523 0 20 4.477 20 10C20 15.523 15.523 20 10 20C4.477 20 0 15.523 0 10C0 4.477 4.477 0 10 0Z"
              fill="currentColor"></path>
          </svg>
        </a>
      </div>
    </label>
  </div>
</body>

</html>
